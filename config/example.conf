# This file is sourced by Bash. Keep it readable only by the account running
# the recorder and use plain shell assignments.

RUN_LABEL=before-change
OBSERVED_SITE=staging.example.com

# Whole-server results need this qualification. Use "unknown" if necessary.
SERVER_SITE_COUNT=10
ENVIRONMENT_NOTE='Staging and live share this server. The observed site is one of ten hosted sites.'

# 24 hours, sampled every 10 seconds: 8,641 timestamped samples including the
# initial sample. Intervals below 10 seconds are rejected.
DURATION_SECONDS=86400
SAMPLE_INTERVAL_SECONDS=10

# Choose a filesystem with at least 20 MiB free. A typical 24-hour bundle is
# only a few MiB.
OUTPUT_ROOT=/var/log/server-performance-recorder/runs

# "auto" follows the device mounted at /. Set one or more exact Linux kernel
# block names, quoted and space-separated, if data/cache/database storage spans
# devices, for example: DISK_DEVICES='nvme0n1 nvme1n1'. Do not name a partition
# as well as its parent device, because that would double-count the same I/O.
DISK_DEVICES=auto

# Runs the sampler at nice 19 and idle I/O priority when the host supports it.
LOW_PRIORITY=1

# Auto-detection supports Nginx, Apache, OpenLiteSpeed and LiteSpeed Enterprise,
# including RunCloud's per-owner ~/logs layout. Set the exact type only if auto
# detection is ambiguous.
WEB_SERVER_TYPE=auto

# This log is NOT read, tailed or copied during recording. Its path is stored
# as provenance so an existing access log can be analysed against the exact UTC
# run window afterwards. Standard combined logs provide request and HTTP status
# counts. Cache ratios additionally require a cache-status field.
ACCESS_LOG_PATH=/var/log/nginx/staging.example.com.access.log
